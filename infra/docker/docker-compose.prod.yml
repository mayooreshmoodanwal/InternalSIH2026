version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vana-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vana}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vana_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vana_prod}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vana}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vana-redis-prod
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: vana-mongodb-prod
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: vana-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - '4000:4000'
    env_file:
      - ../../services/api/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vana}:${POSTGRES_PASSWORD:-vana_secure_pass}@postgres:5432/${POSTGRES_DB:-vana_prod}?schema=public
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongodb:27017/vana_prod

  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: vana-web-prod
    restart: always
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
